  const c=sync.cfg();
  const inten=Math.round((state.settings.intensity||INTENSITY_DEFAULT)*100);
  const wk=mesoWeek(state);
  let h='';

  h+='<div class="card"><div class="eyebrow">Sync across devices</div>'+
    '<div class="row between" style="margin-bottom:12px"><span style="font-size:14px">'+
    (sync.ready()?'<b class="t-green">Connected</b>':'<b class="t-dim">Not connected</b>')+
    '</span><span class="sp-val">'+esc(sync.msg)+'</span></div>'+
    '<input class="txtin" id="cfgOwner" placeholder="GitHub username" value="'+esc(c.owner)+'">'+
    '<input class="txtin" id="cfgRepo" placeholder="Repository name" value="'+esc(c.repo)+'">'+
    '<input class="txtin" id="cfgToken" type="password" placeholder="Fine-grained token" value="'+(c.token?"________":"")+'">'+
    '<div class="row wrap" style="gap:8px"><button class="btn btn-amber btn-sm grow" onclick="app.saveSync()">Save and sync</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="app.pullNow()">Pull now</button></div>'+
    '<div class="danger" style="margin-top:12px">The token stays in this phone\'s storage and is never written into the site. Do not paste it into index.html: GitHub scans public repos and revokes leaked tokens automatically, so it would stop working within hours. Create a <b>fine-grained</b> token limited to this one repository with Contents: read and write.</div>'+
    '<p class="hint">Your log is committed to <b>'+esc(c.path)+'</b> in that repo. Open the app on another device, paste the same token, and it merges both sides by session, so nothing is lost either way.</p></div>';

  h+='<div class="card"><div class="eyebrow">Rest clock</div>'+
    '<label class="toggle" style="margin-top:0"><input type="checkbox" '+(state.settings.restTimer===false?'':'checked')+
    ' onchange="app.restToggle(this.checked)"><span>Start a countdown after every logged set. Three minutes on compounds, two on isolations, ninety seconds on core. Skip or extend it any time.</span></label>'+
    '<p class="hint">Longer rest lets you finish more reps at the same load, and those reps are where the growth is. Cutting rest short is a false economy: you buy time and pay in reps.</p></div>';
  h+='<div class="card"><div class="eyebrow">Global intensity</div>'+
    '<div class="row between"><span style="color:var(--dim);font-size:13px">Scales every prescribed weight</span>'+
    '<span id="intenVal" class="mono" style="color:var(--amber);font-size:20px;font-weight:700">'+inten+'%</span></div>'+
    '<input type="range" class="slider" min="75" max="110" step="1" value="'+inten+'" oninput="app.intensityPreview(this.value)" onchange="app.intensity(this.value)" aria-label="Global intensity">'+
    (inten!==100?'<div class="actions"><button class="btn btn-ghost btn-sm" onclick="app.intensity(100)">Reset to 100%</button></div>':'')+
    '<p class="hint"><b>100% means exactly what the program prescribes.</b> Anything else is a deliberate discount you are applying on top, and it shows on the Today screen and in the session header so it never applies quietly. The program loads already come off the middle of each rep range, and the weights follow what you actually lift, so you should not need this. Reach for it only if every single machine feels wrong.</p></div>';

  const eccPct=Math.round((state.settings.eccPct==null?ECC_PCT_DEFAULT:state.settings.eccPct)*100);
  h+='<div class="card"><div class="eyebrow">Negative load</div>'+
    '<div class="row between"><span style="color:var(--dim);font-size:13px">Lowering weight, as a share of your e1RM</span>'+
    '<span id="eccVal" class="mono" style="color:var(--amber);font-size:20px;font-weight:700">'+eccPct+'%</span></div>'+
    '<input type="range" class="slider" min="80" max="105" step="5" value="'+eccPct+'" oninput="app.eccPreview(this.value)" onchange="app.ecc(this.value)" aria-label="Negative load as percent of one rep max">'+
    '<p class="hint">Research sets eccentric load as a share of your 1RM, not as a flat percentage above the lifting weight. Eccentric muscle activity only rises measurably past roughly 80%; beyond about 110% it starts eating into the lifting phase. 90% sits in the useful band whatever the rep range. Type a different split on the machine and the app follows yours instead.</p></div>';

  const sched=state.settings.schedule||3;
  const SCHED_NOTE={
    2:"Reduced week. Two long sessions that keep your full upper and core volume and add a maintenance dose of legs. Priorities go first, leg press last \u2014 drop it if you are short on time.",
    3:"Default. Two upper days and one leg day: full chest, arm, posture and ab volume; legs and the oblique / lower-back work run lighter.",
    4:"Extra week. The full four-day upper/lower split \u2014 everything at full volume, legs included."
  };
  h+='<div class="card"><div class="eyebrow">Weekly schedule</div>'+
    '<div class="row wrap" style="gap:8px">'+
    [2,3,4].map(n=>'<button class="btn '+(sched===n?'btn-amber':'btn-ghost')+' btn-sm grow" onclick="app.schedule('+n+')">'+n+'\u00d7 / week</button>').join('')+
    '</div>'+
    '<p class="hint">'+SCHED_NOTE[sched]+'</p></div>';

  h+='<div class="card"><div class="eyebrow">Training block</div>'+
    '<div class="row between wrap"><span style="color:var(--dim);font-size:13px">Week <b class="mono" style="color:var(--cream);font-size:16px">'+wk+'</b> of '+BLOCK_WEEKS+'</span>'+
    '<button class="btn btn-ghost btn-sm" onclick="app.newMeso()">Start new block</button></div>'+
    '<p class="hint">Weeks 1-2 all Regular. Weeks 3-5 the anchor lift runs Negative. Week 6 is the deload, then it cycles. A block-week is '+SESSIONS_PER_BLOCK_WEEK+' sessions, so the block tracks what you actually train \u2014 not the calendar.</p>'+
    '<label class="toggle"><input type="checkbox" '+(state.settings.deload?'checked':'')+' onchange="app.deload(this.checked)">'+
    '<span>Deload: half the sets, load eased 15%, anchors run Isokinetic.</span></label>'+
    (wk>=BLOCK_WEEKS&&!state.settings.deload?'<div class="warn" style="margin-top:12px">Deload phase. Switch deload on; the block restarts after the next few sessions.</div>':'')+'</div>';

  h+='<div class="card"><div class="eyebrow" onclick="app.methods()" style="cursor:pointer">Why each method is where it is '+(ui.showMethods?"▾":"▸")+'</div>';
  if(ui.showMethods){
    for(const [k,m] of Object.entries(METHODS)){
      h+='<div class="method-note"><b>'+k+'</b> — '+esc(m.what)+'<br>'+esc(m.why)+'</div>';
    }
    h+='<p class="hint">Explonic is left out on purpose: it trains speed and power, which does nothing for how you look.</p>';
  }
  h+='</div>';

  h+='<div class="card"><div class="eyebrow">Log an EGYM strength test</div>'+
    '<div class="chips" style="margin-bottom:11px">'+Object.entries(MACHINES).map(([k,m])=>
      '<button class="chipbtn '+(k===ui.testM?'on':'')+'" onclick="app.testM(\''+k+'\')">'+esc(m.name)+'</button>').join('')+'</div>'+
    '<div class="row"><input class="win" id="testLb" inputmode="decimal" placeholder="lb" style="width:110px">'+
    '<button class="btn btn-amber btn-sm" onclick="app.saveTest()">Save test</button></div>'+
    '<p class="hint">Optional. Weights come from what you actually lift; a test is one more outlier-guarded data point, and it keeps your BioAge current on EGYM\'s side.</p></div>';

  h+='<div class="card"><div class="eyebrow">Backup</div>'+
    '<div class="row wrap" style="gap:8px"><button class="btn btn-ghost btn-sm grow" onclick="app.exportBackup()">Export file</button>'+
    '<button class="btn btn-ghost btn-sm grow" onclick="document.getElementById(\'importFile\').click()">Import file</button>'+
    '<input type="file" id="importFile" accept="application/json" style="display:none" onchange="app.importBackup(this)"></div></div>';

  h+='<div class="card"><div class="eyebrow">Version</div>'+
    '<div class="row between"><span style="color:var(--dim);font-size:13px">Running</span>'+
    '<span class="mono" style="color:var(--amber);font-size:18px;font-weight:700">v'+APP_VERSION+'</span></div>'+
    '<div class="row between" style="margin-top:6px"><span style="color:var(--dim);font-size:13px">Built</span>'+
    '<span class="mono" style="color:var(--faint);font-size:13px">'+APP_BUILT+'</span></div>'+
    '<p class="hint">If this does not match the version you just uploaded, open the app once more with internet: the service worker serves the cached copy first and installs the new one behind it. Still stale after two launches? Remove it from the home screen and re-add from Safari.</p></div>';

  h+='<div class="card"><div class="eyebrow">Danger zone</div>'+
    '<button class="btn btn-ghost btn-sm" onclick="app.reset()">Erase everything on this device</button></div>';
  return h;
}

// ---------- render ----------
function render(){
  const vt=document.getElementById("verTag");
  if(vt) vt.textContent="v"+APP_VERSION;   // header always matches the code
  const el=document.getElementById("app");
  el.innerHTML = ui.tab==="today"?todayView():ui.tab==="session"?sessionView():ui.tab==="progress"?progressView():dataView();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===ui.tab));
  paintSync();
}

// ---------- actions ----------
window.app = {
  tab(t){ ui.tab=t; render(); window.scrollTo(0,0); },
  rough(v){ ui.rough=v; },
  grp(g){ ui.openGrp = ui.openGrp===g?null:g; render(); },
  focus(m){ ui.focus = ui.focus===m?null:m; render(); },
  methods(){ ui.showMethods=!ui.showMethods; render(); },
  progMode(m){ ui.progMode=m; render(); window.scrollTo(0,0); },
  prog(m){ ui.progM=m; ui.progMode="e1rm"; render(); window.scrollTo(0,0); },
  testM(m){ ui.testM=m; render(); },
  intensityPreview(v){ const n=document.getElementById("intenVal"); if(n) n.textContent=v+"%"; },
  intensity(v){ mutate(s=>({...s, settings:{...s.settings, intensitySet:true,
    intensity:Math.max(0.75,Math.min(1.10,(+v)/100))}})); },
  eccPreview(v){ const n=document.getElementById("eccVal"); if(n) n.textContent=v+"%"; },
  ecc(v){ mutate(s=>({...s, settings:{...s.settings, eccPct:Math.max(0.80,Math.min(1.05,(+v)/100))}})); },
  start(day){
    rest.stop();
    ui.drafts={}; ui.focus=null; ui.logErr=null;
    mutate(s=>({...s, active:{day, rough:ui.rough, deload:!!s.settings.deload,
      intensity:s.settings.intensity||INTENSITY_DEFAULT, entries:[], started:new Date().toISOString()}}));
    ui.tab="session"; render(); window.scrollTo(0,0);
  },
  setW(m,v){ draft(PROGRAM[state.active.day].items.find(i=>i.m===m)).w=v; },
  setWe(m,v){ draft(PROGRAM[state.active.day].items.find(i=>i.m===m)).we=v; },
  reps(m,d){ const it=PROGRAM[state.active.day].items.find(i=>i.m===m); const dr=draft(it); dr.reps=Math.max(1,Math.min(40,dr.reps+d)); render(); },
  rir(m,r){ const it=PROGRAM[state.active.day].items.find(i=>i.m===m); draft(it).rir=r; render(); },
  restSkip(){ rest.stop(); },
  restAdd(sec){ rest.extend(sec); },
  restToggle(v){ if(!v) rest.stop(); mutate(s=>({...s, settings:{...s.settings, restTimer:v}})); },
  log(m, method, adaptive){
    const inp=document.getElementById("w-"+m);
    const w=parseFloat((inp?inp.value:"").replace(",","."));
    const inpE=document.getElementById("we-"+m);
    let we=inpE?parseFloat((inpE.value||"").replace(",",".")):0;
    const it=PROGRAM[state.active.day].items.find(i=>i.m===m);
    const d=draft(it);
    // Reject rather than silently store nonsense: a stray minus or an extra digit would
    // otherwise poison the e1RM, the chart and every weight prescribed from then on.
    if(!isFinite(w)||w<=0){ ui.logErr={m, msg:"Enter a weight above zero."}; render(); return; }
    if(w>MAX_LB){ ui.logErr={m, msg:"That is over "+MAX_LB+" lb — check for a typo."}; render(); return; }
    if(!isFinite(d.reps)||d.reps<1){ ui.logErr={m, msg:"Reps must be at least 1."}; render(); return; }
    if(!isFinite(we)||we<=0||we>MAX_LB) we=0;
    ui.logErr=null;
    mutate(s=>{
      const a=s.active, entries=[...a.entries];
      const i=entries.findIndex(e=>e.m===m);
      const set={w, reps:d.reps, rir:adaptive?0:d.rir};
      if(we>0) set.we=we;
      if(i>=0) entries[i]={...entries[i], sets:[...entries[i].sets, set]};
      else entries.push({m, method, sets:[set]});
      return {...s, active:{...a, entries}};
    });
    const done=(state.active.entries.find(e=>e.m===m)||{sets:[]}).sets.length;
    let target=it.sets;
    if(state.active.rough&&target>=3) target--;
    if(state.active.deload) target=Math.max(1,Math.ceil(it.sets/2));
    rest.start(it.rest||150, done<target
      ? MACHINES[m].name+" · set "+(done+1)+" of "+target
      : "Move on to the next machine");
  },
  finish(){
    rest.stop();
    mutate(s=>{
      const a=s.active; if(!a) return s;
      const entries=a.entries.filter(e=>e.sets.length>0);
      const sessions=entries.length?[...s.sessions,{id:Date.now(),date:new Date().toISOString(),day:a.day,
        rough:!!a.rough, deload:!!a.deload, intensity:a.intensity||1, entries}]:s.sessions;
      return {...s, sessions, active:null};
    });
    ui.tab="today"; ui.focus=null; render(); window.scrollTo(0,0);
  },
  discard(){ if(confirm("Discard this session?")){ rest.stop(); mutate(s=>({...s, active:null})); } },
  saveTest(){
    const inp=document.getElementById("testLb");
    const v=parseFloat((inp.value||"").replace(",","."));
    if(!isFinite(v)||v<=0||v>MAX_LB) return;
    mutate(s=>({...s, tests:[...s.tests,{id:Date.now(),date:new Date().toISOString(),m:ui.testM,lb:v}]}));
  },
  deload(v){ mutate(s=>({...s, settings:{...s.settings, deload:v}})); },
  schedule(n){ if([2,3,4].indexOf(n)<0) return; mutate(s=>({...s, settings:{...s.settings, schedule:n}})); },
  newMeso(){ mutate(s=>({...s, settings:{...s.settings, blockAnchorCount:(s.sessions||[]).length, deload:false}})); },
  saveSync(){
    const owner=(document.getElementById("cfgOwner").value||"").trim();
    const repo=(document.getElementById("cfgRepo").value||"").trim();
    const tokIn=(document.getElementById("cfgToken").value||"").trim();
    const patch={owner,repo};
    if(tokIn && tokIn!=="________") patch.token=tokIn;
    saveCfg(patch);
    sync.sha=null;
    sync.pull().then(ok=>{ if(ok) sync.push(false); render(); });
  },
  pullNow(){ sync.sha=null; sync.pull(); },
  exportBackup(){
    const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="egym-console-"+new Date().toISOString().slice(0,10)+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },
  importBackup(input){
    const f=input.files&&input.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!Array.isArray(data.sessions)) throw new Error("bad file");
        mutate(s=>mergeState(s,data));
        alert("Restored. Now holding "+state.sessions.length+" sessions.");
      }catch(e){ alert("That file is not a valid console backup."); }
    };
    r.readAsText(f);
    input.value="";
  },
  reset(){
    if(confirm("Erase all sessions, tests and settings from this device?")){
      mutate(()=>({...DEFAULT_STATE, settings:{mesoStart:new Date().toISOString(), deload:false,
        intensity:INTENSITY_DEFAULT, eccPct:ECC_PCT_DEFAULT, schedule:3, blockAnchorCount:0}}));
    }
  },
};

// Anything presented as a button must work from the keyboard, not just the mouse.
// Delegated so it covers every role="button" the views generate, now and later.
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" " && e.key!=="Spacebar") return;
  const t=e.target;
  if(t && t.getAttribute && t.getAttribute("role")==="button"){ e.preventDefault(); t.click(); }
});

render();
if(sync.ready()) sync.pull();
window.addEventListener("online", ()=>{ if(sync.ready()) sync.pull(); });
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
