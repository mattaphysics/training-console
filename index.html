<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Console</title>
<meta name="theme-color" content="#201d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Console">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{
  --bg:#201d1a; --panel:#2a2622; --panel2:#322d28; --line:#453e36; --line2:#5a5148;
  --cream:#ece3d3; --dim:#a89c88; --faint:#8d8271;
  --amber:#e8a33d; --green:#8fb573; --red:#c8564a; --blue:#7ba3c8; --dark:#241c0e;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
html{-webkit-text-size-adjust:100%;}
html,body{background:var(--bg);}
body{color:var(--cream);font-family:var(--sans);max-width:540px;margin:0 auto;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:16px;line-height:1.5;}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(32,29,26,.94);backdrop-filter:blur(12px);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);}
.hdr-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.hdr-title{font-weight:800;font-size:21px;letter-spacing:-.01em;}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;background:var(--panel);cursor:pointer;min-height:38px;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#4a423a;flex:none;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 7px rgba(143,181,115,.8);}
.sync-dot.busy{background:var(--amber);box-shadow:0 0 7px rgba(232,163,61,.8);animation:pulse 1.1s infinite;}
.sync-dot.err{background:var(--red);box-shadow:0 0 7px rgba(200,86,74,.8);}
@keyframes pulse{50%{opacity:.35}}
.sync-txt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

.body{padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
.card-flat{background:transparent;border-color:var(--line);}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
.mono{font-family:var(--mono);}
.t-green{color:var(--green);} .t-amber{color:var(--amber);} .t-red{color:var(--red);} .t-dim{color:var(--dim);}

/* today headline */
.verdict{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
.verdict-sub{color:var(--dim);font-size:14px;margin-top:7px;}
.readybar{display:flex;align-items:center;gap:12px;margin-top:16px;}
.ready-num{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;}
.ready-meta{font-size:12px;color:var(--faint);line-height:1.45;}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);}
.stats b{color:var(--cream);font-family:var(--mono);font-size:14px;display:block;margin-top:2px;}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--cream);border-radius:12px;
  padding:0 18px;min-height:var(--tap);font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn:active{transform:scale(.98);}
.btn-amber{background:var(--amber);color:var(--dark);border-color:var(--amber);}
.btn-ghost{background:transparent;}
.btn:disabled{color:var(--faint);border-style:dashed;background:transparent;opacity:.65;}
.btn-sm{min-height:44px;padding:0 15px;font-size:13px;border-radius:11px;}
.btn-wide{width:100%;}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;}
.grow{flex:1;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}

/* readiness groups */
.grp-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:var(--tap);}
.grp-row:last-of-type{border-bottom:none;}
.grp-name{width:64px;flex:none;font-size:14px;font-weight:600;}
.grp-track{display:block;flex:1;height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line);}
.grp-fill{display:block;height:100%;border-radius:5px;transition:width .5s ease;}
@media (prefers-reduced-motion: reduce){.grp-fill{transition:none;}}
.f-green{background:var(--green);} .f-amber{background:var(--amber);} .f-red{background:var(--red);} .f-dim{background:#5a5148;}
.grp-val{font-family:var(--mono);font-size:14px;font-weight:600;width:44px;text-align:right;flex:none;}
.grp-caret{color:var(--faint);font-size:12px;width:14px;flex:none;text-align:center;}
.grp-detail{padding:4px 0 12px 76px;}
.mini{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px;}
.mini-name{flex:1;color:var(--dim);}
.mini-track{display:block;width:66px;height:5px;border-radius:3px;background:var(--bg);overflow:hidden;flex:none;border:1px solid var(--line);}
.mini-val{font-family:var(--mono);color:var(--faint);width:34px;text-align:right;flex:none;}

/* exercise accordion */
.ex{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;}
.ex+.ex{margin-top:10px;}
.ex-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:var(--tap);}
.ex-idx{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px;flex:none;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-weight:700;font-size:16px;}
.ex-sub{font-size:12px;color:var(--dim);margin-top:3px;}
.ex-state{font-family:var(--mono);font-size:11px;flex:none;text-align:right;}
.ex.done .ex-name{color:var(--dim);}
.ex-body{padding:0 16px 16px;border-top:1px solid var(--line);margin-top:2px;padding-top:14px;}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:7px;border:1px solid var(--line);white-space:nowrap;}
.chip-Negative{color:var(--amber);border-color:rgba(232,163,61,.55);}
.chip-Regular{color:var(--dim);}
.chip-Adaptive{color:var(--red);border-color:rgba(200,86,74,.55);}
.chip-Isokinetic{color:var(--green);border-color:rgba(143,181,115,.55);}

/* prescription block */
.rx{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
.rx-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.rx-w{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;}
.rx-u{font-size:13px;color:var(--faint);}
.rx-reps{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--dim);}
.rx-ecc{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2);}
.rx-ecc-col{flex:1;}
.rx-ecc-lab{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
.rx-ecc-val{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:3px;}
.rx-arrow{color:var(--faint);font-size:17px;}
.rx-why{font-size:12px;color:var(--faint);margin-top:11px;line-height:1.45;}
.rx-why b{font-family:var(--mono);}

/* logging */
.logrow{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.field{flex:1;min-width:118px;}
.field-lab{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
.win{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;color:var(--cream);
  font-family:var(--mono);font-size:20px;font-weight:600;padding:0 12px;height:var(--tap);text-align:center;}
.step{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:12px;height:var(--tap);}
.step button{width:46px;height:100%;background:none;border:none;color:var(--amber);font-size:24px;font-weight:600;cursor:pointer;}
.step span{font-family:var(--mono);flex:1;text-align:center;font-size:19px;font-weight:600;}
.rirrow{display:flex;gap:6px;}
.rirrow button{flex:1;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);
  color:var(--dim);font-family:var(--mono);font-size:15px;cursor:pointer;}
.rirrow button.on{background:var(--amber);border-color:var(--amber);color:var(--dark);font-weight:700;}
.setrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.setpill{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;color:var(--dim);}
.setpill.last{border-color:var(--amber);color:var(--cream);}

/* misc */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chipbtn{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:0 16px;height:44px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;}
.chipbtn.on{color:var(--dark);background:var(--amber);border-color:var(--amber);font-weight:700;}
.bigval{font-family:var(--mono);font-size:30px;font-weight:700;}
.bigval .unit{font-size:12px;color:var(--faint);font-weight:400;}
.delta{font-family:var(--mono);font-size:13px;}
.legend{color:var(--faint);font-size:11px;margin-top:9px;display:flex;gap:15px;flex-wrap:wrap;}
.volrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.vol-label{width:88px;font-size:12px;color:var(--dim);flex:none;}
.vol-track{display:block;flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.vol-fill{display:block;height:100%;border-radius:4px;}
.vol-num{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:50px;text-align:right;flex:none;}
.sprow{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;border-bottom:1px solid var(--line);min-height:46px;}
.sprow:last-child{border-bottom:none;}
.sp-name{flex:1;font-size:13px;color:var(--dim);}
.sp-name.on{color:var(--cream);font-weight:600;}
.sp-val{font-family:var(--mono);font-size:12px;color:var(--faint);min-width:62px;text-align:right;flex:none;}
.hint{color:var(--faint);font-size:12px;line-height:1.55;margin-top:10px;}
.warn{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.4);border-radius:12px;
  padding:12px 14px;font-size:12px;color:var(--amber);line-height:1.5;}
.danger{background:rgba(200,86,74,.1);border:1px solid rgba(200,86,74,.35);border-radius:12px;
  padding:12px 14px;font-size:12px;color:var(--cream);line-height:1.5;}
.cardio{color:var(--dim);font-size:13px;border-style:dashed;}
.toggle{display:flex;gap:11px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--dim);line-height:1.45;cursor:pointer;}
.toggle input{margin-top:1px;accent-color:var(--amber);width:22px;height:22px;flex:none;}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:5px;margin:16px 0 4px;
  border-radius:3px;background:var(--line);outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:var(--amber);border:4px solid var(--panel);cursor:pointer;}
.slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--amber);border:4px solid var(--panel);cursor:pointer;}
.txtin{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:11px;color:var(--cream);
  font-family:var(--mono);font-size:16px;padding:0 13px;height:48px;margin-bottom:9px;}
.method-note{font-size:12px;color:var(--dim);line-height:1.55;padding:11px 0;border-bottom:1px solid var(--line);}
.method-note:last-child{border-bottom:none;}
.method-note b{color:var(--cream);}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:0 auto;display:flex;z-index:20;
  background:rgba(42,38,34,1);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
.nav button{flex:1;padding:13px 0 15px;background:none;border:none;color:var(--faint);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;min-height:56px;}
.nav button.on{color:var(--amber);}
.nav .badge{display:block;font-size:15px;margin-bottom:3px;font-family:var(--sans);}
/* rest clock: fixed above the nav, owned imperatively so re-renders never disturb it */
.restbar{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:0;right:0;max-width:540px;
  margin:0 auto;z-index:19;display:none;align-items:center;gap:12px;padding:11px 14px;
  background:rgba(42,38,34,1);border-top:1px solid var(--line);}
.restbar.on{display:flex;}
.restbar.done{border-top-color:var(--green);}
.rest-time{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--amber);min-width:62px;}
.restbar.done .rest-time{color:var(--green);}
.rest-mid{flex:1;min-width:0;}
.rest-lab{font-size:11px;color:var(--faint);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rest-track{display:block;height:4px;border-radius:2px;background:var(--bg);overflow:hidden;border:1px solid var(--line);}
.rest-fill{display:block;height:100%;background:var(--amber);border-radius:2px;}
.restbar.done .rest-fill{background:var(--green);}
body.resting{padding-bottom:calc(150px + env(safe-area-inset-bottom));}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-eyebrow">Fred Fitness · EGYM · <span id="verTag">v4.0</span></div>
    <div class="hdr-title">Training Console</div>
  </div>
  <div class="sync" onclick="app.tab('data')" role="button" tabindex="0">
    <span id="syncDot" class="sync-dot"></span><span id="syncTxt" class="sync-txt">Local</span>
  </div>
</div>
<div id="app" class="body"></div>
<div id="restbar" class="restbar"></div>
<div class="nav">
  <button data-tab="today" onclick="app.tab('today')"><span class="badge">◎</span>Today</button>
  <button data-tab="session" onclick="app.tab('session')"><span class="badge">▮</span>Session</button>
  <button data-tab="progress" onclick="app.tab('progress')"><span class="badge">◠</span>Progress</button>
  <button data-tab="data" onclick="app.tab('data')"><span class="badge">≡</span>Data</button>
</div>
<script>
"use strict";
// ============================================================
// EGYM TRAINING CONSOLE v4.0
// Goal: aesthetic hypertrophy on the Fred Fitness EGYM floor.
// Units: pounds.
// ============================================================
const APP_VERSION = "4.5";
const APP_BUILT = "2026-08-26";   // bump both whenever index.html changes
const KEY = "egym-console-v1";
const TOKEN_KEY = "egym-console-token";
const ROUND_LB = 5, HOUR = 3600000;
const MAX_LB = 2000;   // sanity ceiling; anything above this is a typo, not a lift
const INTENSITY_DEFAULT = 1.00;   // 100% = exactly what the program prescribes
// Negative load is set as a share of your estimated 1RM, not as a flat surplus over the
// lifting weight. The literature classifies eccentric load by %1RM, and eccentric muscle
// activity only rises measurably once it clears roughly 80% 1RM. Above ~110% it starts
// costing concentric performance. 90% sits in the useful band on every rep range.
const ECC_PCT_DEFAULT = 0.90;

// Repo that holds your data.json. Safe to publish: no secret here.
const SYNC = { owner:"", repo:"", branch:"main", path:"data.json" };

// ---------- muscles ----------
// tau = fatigue half-life in hours (big slow muscles decay slower)
// ref = the single-session primary dose that flattens it
const MUSCLES = {
  chest:{label:"Chest",tau:38,ref:8,grp:"Push"},
  delts:{label:"Shoulders",tau:28,ref:6.5,grp:"Push"},
  triceps:{label:"Triceps",tau:26,ref:7.5,grp:"Push"},
  lats:{label:"Lats",tau:38,ref:6,grp:"Pull"},
  upperBack:{label:"Upper back",tau:36,ref:7,grp:"Pull"},
  rearDelts:{label:"Rear delts",tau:26,ref:6.5,grp:"Pull"},
  biceps:{label:"Biceps",tau:26,ref:8,grp:"Pull"},
  abs:{label:"Abs",tau:24,ref:3.5,grp:"Core"},
  obliques:{label:"Obliques",tau:24,ref:3.5,grp:"Core"},
  lowerBack:{label:"Lower back",tau:40,ref:3.5,grp:"Core"},
  quads:{label:"Quads",tau:44,ref:7.5,grp:"Legs"},
  hamstrings:{label:"Hamstrings",tau:40,ref:7,grp:"Legs"},
  glutes:{label:"Glutes",tau:40,ref:9,grp:"Legs"},
  adductors:{label:"Adductors",tau:30,ref:3,grp:"Legs"},
};
const GROUPS = {
  Push:["chest","delts","triceps"],
  Pull:["lats","upperBack","rearDelts","biceps"],
  Core:["abs","obliques","lowerBack"],
  Legs:["quads","hamstrings","glutes"],
};

// ---------- machines on the Fred Fitness floor ----------
const MACHINES = {
  chestPress:{name:"Chest press",primary:["chest"],secondary:["triceps","delts"],seed:212,kind:"compound"},
  butterfly:{name:"Butterfly",primary:["chest"],secondary:[],seed:121,kind:"isolation"},
  shoulderPress:{name:"Shoulder press",primary:["delts"],secondary:["triceps"],seed:110,kind:"compound"},
  triceps:{name:"Triceps",primary:["triceps"],secondary:[],seed:130,kind:"isolation"},
  reverseFlys:{name:"Reverse flys",primary:["rearDelts"],secondary:["upperBack"],seed:49,kind:"isolation"},
  crunch:{name:"Abdominal crunch",primary:["abs"],secondary:[],seed:201,kind:"isolation"},
  backExt:{name:"Back extension",primary:["lowerBack"],secondary:["glutes"],seed:157,kind:"isolation"},
  legPress:{name:"Leg press",primary:["quads","glutes"],secondary:["hamstrings"],seed:595,kind:"compound"},
  latPulldown:{name:"Lat pulldown",primary:["lats"],secondary:["biceps","upperBack"],seed:236,kind:"compound"},
  seatedRow:{name:"Seated row",primary:["upperBack"],secondary:["lats","biceps","rearDelts"],seed:168,kind:"compound"},
  bicepCurl:{name:"Bicep curl",primary:["biceps"],secondary:[],seed:44,kind:"isolation"},
  rotaryTorso:{name:"Rotary torso",primary:["obliques"],secondary:[],seed:86,kind:"isolation"},
  hipThrust:{name:"Hip thrust",primary:["glutes"],secondary:["hamstrings"],seed:214,kind:"compound"},
  legCurl:{name:"Leg curl",primary:["hamstrings"],secondary:[],seed:157,kind:"isolation"},
  legExt:{name:"Leg extension",primary:["quads"],secondary:[],seed:245,kind:"isolation"},
  adductor:{name:"Adductor",primary:["adductors"],secondary:[],seed:187,kind:"isolation"},
};

// ---------- EGYM training methods ----------
const METHODS = {
  Regular:{
    what:"Same resistance lifting and lowering.",
    why:"The backbone. Volume of hard straight sets is what drives size, so most work sits here.",
    set:"Enter one weight. That is the weight both ways."},
  Negative:{
    what:"The machine adds load at the turnaround and slows the lowering.",
    why:"Builds force output and tendon robustness. Research on trained lifters shows it does NOT beat regular sets for size, so it runs on one compound per session, and only in weeks 3-5.",
    set:"Enter BOTH weights on the machine: the positive for lifting and the heavier negative for lowering. The machine swaps between them at the turnaround."},
  Adaptive:{
    what:"Resistance falls as you tire, so the set continues past the point you would normally rack it.",
    why:"EGYM's growth method: an automatic drop set. Cheapest way to add stimulus without adding joint load, so it runs as the last set of isolations.",
    set:"Enter your normal working weight. Keep going until you cannot move it."},
  Isokinetic:{
    what:"Speed stays fixed. Push harder and it pushes back harder.",
    why:"Effort matches whatever you have that day, so nothing gets overloaded. Used on rough days and through deload weeks.",
    set:"Weight is a guide only. The machine matches your effort."},
};

// Load fraction taken from the MIDDLE of the rep range at ~2 reps in reserve,
// leaving room to add reps before adding weight.
const pctFor = (lo,hi) => 1/(1 + ((lo+hi)/2 + 2)/30);
// Longer rest lets you complete more reps at the same load, which is where the extra
// growth comes from. Compounds get the full three minutes; isolations and core need less.
const restFor = m => (m==="crunch"||m==="rotaryTorso") ? 90
  : (MACHINES[m].kind==="compound" ? 180 : 120);
const ex = (m,sets,lo,hi,o) => Object.assign({m,sets,lo,hi,pct:pctFor(lo,hi),rest:restFor(m)}, o||{});
const exF = (m,sets,o) => Object.assign({m,sets,lo:0,hi:0,pct:pctFor(12,15),adaptive:true,rest:restFor(m)}, o||{});

// Frequency has no consistent effect on hypertrophy in the current meta-analytic
// evidence, so each muscle gets one hard, coherent exposure per session rather than
// being smeared thin. Sessions are content-named, not day-named: the schedule setting
// (2, 3 or 4 per week) picks which of these run and in what rotation, so the program
// stays coherent whatever the week looks like.

// What one full 4x week delivers, in fractional sets — the reference the volume bars read against.
const TARGETS = {chest:10,delts:7.5,triceps:11.5,lats:7.5,upperBack:12.5,rearDelts:10.5,biceps:12.5,
  abs:9,obliques:6,lowerBack:6,quads:10,hamstrings:13,glutes:17};
// Which sessions run, and in what order, for each weekly schedule.
const SCHEDULES = { 2:["R1","R2"], 3:["A","L","C"], 4:["A","B","C","D"] };
function orderFor(s){ const n=(s&&s.settings&&s.settings.schedule)||3; return SCHEDULES[n]||SCHEDULES[3]; }
function weekTarget(s){ return (s&&s.settings&&s.settings.schedule)||3; }

// ---------- e1RM ----------
const clamp01 = x => Math.max(0, Math.min(1, x));
const epley = (w,reps,rir) => w * (1 + Math.min(reps + Math.min(rir||0,4), 20)/30);
const roundLb = w => Math.max(ROUND_LB, Math.round(w/ROUND_LB)*ROUND_LB);

function machinePoints(s, mId){
  const pts=[];
  for(const ss of s.sessions){
    const e=ss.entries.find(x=>x.m===mId);
    if(!e||!e.sets.length) continue;
    let bE=0,bW=0;
    for(const st of e.sets){ if(st.w>0&&st.reps>0){ const v=epley(st.w,st.reps,st.rir); if(v>bE){bE=v;bW=st.w;} } }
    if(bE>0) pts.push({t:new Date(ss.date).getTime(), v:bE, w:bW, src:"set"});
  }
  for(const t of (s.tests||[])) if(t.m===mId&&t.lb>0) pts.push({t:new Date(t.date).getTime(), v:t.lb, w:null, src:"test"});
  pts.sort((a,b)=>a.t-b.t);
  return pts;
}
// Exponentially weighted over the last six points, with outliers damped.
function rollFromPoints(all){
  const pts=all.slice(-6);
  if(!pts.length) return null;
  const mean=pts.reduce((a,p)=>a+p.v,0)/pts.length;
  let num=0,den=0;
  pts.forEach((p,i)=>{
    let w=Math.pow(0.8,pts.length-1-i);
    if(pts.length>=3&&(p.v<0.88*mean||p.v>1.15*mean)) w*=0.25;
    num+=p.v*w; den+=w;
  });
  return den? num/den : null;
}
function rollingE1RM(s, mId){
  const pts=machinePoints(s,mId);
  if(!pts.length) return {v:MACHINES[mId].seed, n:0, seeded:true};
  return {v:rollFromPoints(pts), n:pts.length, seeded:false};
}

// ---------- method selection ----------
const BLOCK_WEEKS = 6;
const SESSIONS_PER_BLOCK_WEEK = 3;          // a block-week is this many sessions
function mesoWeek(s){
  // Session-based, not calendar-based: the block advances with training done, so an
  // irregular week-to-week schedule never marches the phase forward on its own.
  const anchor=(s.settings&&s.settings.blockAnchorCount)||0;
  const done=Math.max(0,(s.sessions?s.sessions.length:0)-anchor);
  const raw=Math.floor(done/SESSIONS_PER_BLOCK_WEEK)+1;
  return ((raw-1)%BLOCK_WEEKS)+1;           // six-phase block that repeats forever
}
// Negative is fatiguing and does not out-build regular sets, so it appears on the
// single anchor compound of a day and only once you are mid-block.
function resolveMethod(item, ctx){
  if(item.adaptive) return "Adaptive";
  if(ctx.deload || ctx.rough) return item.anchor ? "Isokinetic" : "Regular";
  if(item.anchor && ctx.week>=3 && ctx.week<=5) return "Negative";
  return "Regular";
}

// ---------- autoregulation ----------
function gradeEntry(e, item){
  const sets=e.sets;
  if(!sets||!sets.length) return null;
  const reps=sets.map(x=>x.reps), rirs=sets.map(x=>x.rir||0);
  const minReps=Math.min(...reps);
  const avgRir=rirs.reduce((a,b)=>a+b,0)/rirs.length;
  const full=sets.length>=item.sets;
  if(item.adaptive){
    const avg=reps.reduce((a,b)=>a+b,0)/reps.length;
    if(avg>=20) return {adj:1.075,step:1,why:"20+ reps to failure"};
    if(avg>=15) return {adj:1.05,step:1,why:"15+ reps to failure"};
    if(avg>=12) return {adj:1.025,step:1,why:"12+ reps to failure"};
    if(avg>=8)  return {adj:1.0,step:0,why:"right in the failure window"};
    return {adj:0.95,step:-1,why:"under 8 reps to failure"};
  }
  // Short of the prescribed reps: ease off.
  if(minReps<item.lo){
    if(minReps>=item.lo-2) return avgRir>=1
      ? {adj:1.0,step:0,why:"just under the range — repeat this weight"}
      : {adj:0.95,step:-1,why:"just under the range at failure"};
    return {adj:0.92,step:-1,why:"well under the target range"};
  }
  if(!full) return {adj:1.0,step:0,why:"sets missing — repeat this weight"};

  // Prescribed reps completed, so the weight goes up. How far is set by two things you had
  // spare: how deep into the rep range you landed, and how many reps stayed in the tank.
  // Position uses the AVERAGE rep across sets (not the worst one), so topping the range on
  // most sets reads as topping the range even if a set lagged. Topping the range with
  // reserve is a much bigger rise than scraping its bottom with the same reserve — the two
  // are no longer close. Continuous, so there is no cliff between 11 reps and 12.
  const span=Math.max(1,item.hi-item.lo);
  const avgReps=reps.reduce((a,b)=>a+b,0)/reps.length;
  const pos=clamp01((avgReps-item.lo)/span);
  const credit=Math.min(7, pos*3.5 + avgRir);
  const rirTxt=avgRir>=0.5?Math.round(avgRir)+" in reserve":"at failure";
  const maxReps=Math.max(...reps);
  const repShown=maxReps===minReps?String(minReps):minReps+"\u2013"+maxReps;
  const why=(pos>=0.85?"top of the range":repShown+" reps")+", "+rirTxt;
  // Below ~2 credits the rise is smaller than one plate; let rounding decide rather than
  // forcing a jump that would be a huge relative step on a light machine.
  return {adj:1+credit*0.0125, step:credit>=2?1:0, why};
}
// Sessions written by older versions may carry no intensity. Falling back to 1 there
// would invent an 8% drop out of nowhere, so fall back to the current setting instead:
// it then cancels cleanly and the weight is driven purely by performance.
function sessionMod(ss){
  const i = ss.intensity!=null ? ss.intensity
          : (state && state.settings && state.settings.intensity!=null ? state.settings.intensity : 1);
  return i*(ss.rough?0.95:1)*(ss.deload?0.85:1);
}

// The negative weight is a second number you type on the machine.
function eccWeight(s, item, dayId, concW, mod){
  // If you typed a different split last time, follow what you actually did.
  for(let i=s.sessions.length-1;i>=0;i--){
    const ss=s.sessions[i];
    if(ss.day!==dayId) continue;
    const e=ss.entries.find(x=>x.m===item.m);
    if(!e) continue;
    const withEcc=e.sets.filter(st=>st.we>0&&st.w>0);
    if(withEcc.length){
      const r=withEcc.reduce((a,st)=>a+st.we/st.w,0)/withEcc.length;
      if(r>=1.05&&r<=1.9) return {w:roundLb(concW*r), followed:true, pct:null};
    }
  }
  const pct=s.settings.eccPct==null?ECC_PCT_DEFAULT:s.settings.eccPct;
  const e1=rollingE1RM(s,item.m).v;
  let w=e1*pct*(mod||1);
  // Meaningfully above the lifting weight, but never absurd if the e1RM seed is off.
  // Round the rails outward first: rounding w afterwards could otherwise land it back
  // under the 20% floor (155 lb against a 130 lb lift is 19%, not 20%).
  const loW=Math.ceil(concW*1.20/ROUND_LB)*ROUND_LB;
  const hiW=Math.max(loW, Math.floor(concW*1.60/ROUND_LB)*ROUND_LB);
  w=Math.min(Math.max(roundLb(w), loW), hiW);
  // Report where it actually landed, not the setting, since the gap floor can bind.
  return {w:w, followed:false, pct:w/e1};
}

// A machine is the same machine whatever day you meet it on, so history is pooled
// across days. What differs is the rep range: Monday chest press is 4x6-10 and
// Thursday is 3x8-12, so a weight carried over is translated between the two via
// the e1RM the sets imply, rather than copied across raw.
function perfHistory(s, mId, dayId, limit){
  const out=[];
  for(let i=s.sessions.length-1;i>=0&&out.length<(limit||2);i--){
    const ss=s.sessions[i];
    const e=ss.entries.find(x=>x.m===mId);
    if(e&&e.sets.length) out.push({ss,e,sameDay:ss.day===dayId});
  }
  return out;
}
// Rep ranges differ between days, so the load that belongs at one range is not the
// load that belongs at another. Scale by the ratio of the two target percentages.
function itemFor(dayId, mId){
  const day=PROGRAM[dayId]; if(!day) return null;
  return day.items.find(i=>i.m===mId)||null;
}
function crossDayScale(fromDayId, toItem, mId){
  const from=itemFor(fromDayId,mId);
  if(!from||!toItem||from.adaptive||toItem.adaptive) return 1;
  if(!(from.pct>0)||!(toItem.pct>0)) return 1;
  return toItem.pct/from.pct;
}
// Next weight builds on the weight actually lifted last time, adjusted by how it went.
function prescribe(s, item, dayId, opts){
  opts=opts||{};
  const intensity=s.settings.intensity||INTENSITY_DEFAULT;
  const roll=rollingE1RM(s,item.m);
  const hist=perfHistory(s,item.m,dayId,2);
  let base, adj=1, why, seeded=false, lastTxt=null, lastW=null, step=0, lastReps=null, crossNote=null;
  if(!hist.length){
    base=roll.v*item.pct; seeded=true;
    why=roll.seeded?"starting point from your EGYM value":"starting point from your rolling e1RM";
  } else {
    const cur=hist[0];
    lastW=Math.max(...cur.e.sets.map(x=>x.w));
    const scale=cur.sameDay?1:crossDayScale(cur.ss.day,item,item.m);
    base=(lastW*scale)/sessionMod(cur.ss);
    const g=gradeEntry(cur.e, cur.sameDay?item:(itemFor(cur.ss.day,item.m)||item));
    adj=g.adj; why=g.why; step=g.step||0;
    if(hist[1]){
      const h2=hist[1];
      const g2=gradeEntry(h2.e, h2.sameDay?item:(itemFor(h2.ss.day,item.m)||item));
      if(g2){
        // Only genuinely strong sessions compound. Now that most sessions earn something,
        // a bonus on any two rises in a row would just be a blanket multiplier.
        if(g.adj>=1.0375&&g2.adj>=1.0375){ adj=1+(adj-1)*1.35; why+=" · two strong sessions"; }
        if(g.adj<1&&g2.adj<1){ adj=1-(1-adj)*1.15; why+=" · two hard sessions"; }
      }
    }
    adj=Math.max(0.90,Math.min(1.12,adj));
    base*=adj;
    const r=cur.e.sets.map(x=>x.reps);
    const fromDay=PROGRAM[cur.ss.day];
    lastTxt=cur.e.sets.length+"x"+Math.min(...r)+"-"+Math.max(...r)+" @ "+lastW+" lb"+
      (cur.sameDay?"":" ("+(fromDay?fromDay.title:cur.ss.day)+")");
    lastReps=Math.min(...r);
    if(!cur.sameDay && Math.abs(scale-1)>0.01)
      crossNote="carried over from "+(fromDay?fromDay.title:cur.ss.day)+" and adjusted for this rep range";
  }
  const anchor=roll.v*item.pct;
  const railLo=anchor*0.70, railHi=anchor*1.45;
  let rail=null;
  if(base>railHi){ base=railHi; rail="high"; }
  else if(base<railLo){ base=railLo; rail="low"; }
  const mod=intensity*(opts.rough?0.95:1)*(opts.deload?0.85:1);
  let w=roundLb(base*mod);
  // A 5% rise on a light machine rounds away to nothing, which would freeze it forever.
  if(step&&lastW!=null){
    const floorW=roundLb(lastW*mod/sessionMod(hist[0].ss));
    if(step>0&&w<=floorW) w=floorW+ROUND_LB;
    if(step<0&&w>=floorW) w=Math.max(ROUND_LB,floorW-ROUND_LB);
  }
  // Pooling is per machine, but a lighter, higher-rep day must never be prescribed above
  // the heavier day it drew from. Translating the weight across ranges can carry it over,
  // and this day's own grade can lift it, but not past what the heavier day actually put up.
  if(hist.length && !hist[0].sameDay && lastW!=null){
    const src=itemFor(hist[0].ss.day,item.m);
    if(src && src.pct>item.pct){
      const cap=roundLb(lastW*mod/sessionMod(hist[0].ss));
      if(w>cap){ w=cap; crossNote="held to the heavier day's weight"; }
    }
  }
  // The prescribed weight is shaped by more than the grade: the intensity setting, the
  // e1RM rails and 5 lb rounding all land after it. Say so, rather than reporting the
  // grade as if it were the change.
  let note=crossNote;
  if(hist.length && !note){
    const modThen=sessionMod(hist[0].ss);
    if(rail==="high") note="held back by your estimated 1RM";
    else if(rail==="low") note="propped up by your estimated 1RM";
    else if(Math.abs(mod-modThen)>0.005)
      note="intensity setting moved "+Math.round(modThen*100)+"% to "+Math.round(mod*100)+"%";
  }
  return {w, adj, why, seeded, last:lastTxt, lastW, lastReps, note};
}
function sessionScore(ss){
  const day=PROGRAM[ss.day]; if(!day) return null;
  let tot=0,n=0;
  for(const e of ss.entries){
    const item=day.items.find(i=>i.m===e.m); if(!item) continue;
    const g=gradeEntry(e,item); if(!g) continue;
    tot+=(g.adj-1)*100; n++;
  }
  return n?tot/n:null;
}

// ---------- fatigue ----------
// Damage markers (creatine kinase, soreness) do NOT differ from regular sets in the
// meta-analytic evidence; the extra cost is metabolic stress and perceived effort, which
// is a smaller penalty than muscle damage would justify.
const METHOD_COST = {Regular:1.0, Negative:1.15, Adaptive:1.15, Isokinetic:0.85};
function fatigueMap(s, ahead=0, now=Date.now()){
  const f={}; Object.keys(MUSCLES).forEach(k=>f[k]=0);
  for(const ss of s.sessions){
    const ageH=(now-new Date(ss.date).getTime())/HOUR+ahead;
    if(ageH<0||ageH>240) continue;
    for(const e of ss.entries){
      const mach=MACHINES[e.m]; if(!mach||!e.sets.length) continue;
      const avg=e.sets.reduce((a,st)=>a+(st.rir||0),0)/e.sets.length;
      const eff=avg<=0.5?1.25:avg<=2?1.0:0.85;
      const dose=e.sets.length*eff*(METHOD_COST[e.method]||1);
      for(const mu of mach.primary) f[mu]+=dose*Math.exp(-ageH/MUSCLES[mu].tau);
      for(const mu of mach.secondary) f[mu]+=0.5*dose*Math.exp(-ageH/MUSCLES[mu].tau);
    }
  }
  const rec={}; Object.keys(MUSCLES).forEach(k=>rec[k]=clamp01(1-f[k]/MUSCLES[k].ref));
  return rec;
}
// A group is only as trainable as its weakest link, softened by the group average.
function groupReadiness(rec, g){
  const ms=GROUPS[g].map(k=>rec[k]);
  return 0.6*Math.min(...ms) + 0.4*(ms.reduce((a,b)=>a+b,0)/ms.length);
}
const pace7 = (s, now=Date.now()) => s.sessions.filter(ss=>now-new Date(ss.date).getTime()<=168*HOUR).length;

function recommend(s, now=Date.now()){
  const ORD=orderFor(s);
  const abc=s.sessions.filter(ss=>ORD.includes(ss.day));
  const next=abc.length?ORD[(ORD.indexOf(abc[abc.length-1].day)+1)%ORD.length]:ORD[0];
  const recNow=fatigueMap(s,0,now), rec24=fatigueMap(s,24,now);
  const kr=r=>Math.min(...PROGRAM[next].key.map(k=>r[k]));
  const rNow=kr(recNow), r24=kr(rec24);
  const pace=pace7(s,now);
  const lastAny=s.sessions.length?new Date(s.sessions[s.sessions.length-1].date).getTime():0;
  const hSince=lastAny?(now-lastAny)/HOUR:999;
  let act, why;
  if(!s.sessions.length){ act="go"; why="Nothing logged yet. Start with "+(PROGRAM[next]?PROGRAM[next].title:"the first session")+" and the console calibrates from what you lift."; }
  else if(rNow>=0.65){ act="go"; why=PROGRAM[next].title+" muscles have recovered."; }
  else if(pace<weekTarget(s)&&hSince>=20){ act="pace"; why="Not fully recovered, but training a little tired keeps you on pace for the week. That is the trade."; }
  else { act="rest"; why="Still carrying fatigue. Tomorrow projects "+Math.round(r24*100)+"%."; }
  return {next,act,why,rNow,r24,pace,recNow};
}
function weeklyVolume(s, now=Date.now()){
  const vol={}; Object.keys(TARGETS).forEach(k=>vol[k]=0);
  for(const ss of s.sessions){
    if(now-new Date(ss.date).getTime()>168*HOUR) continue;
    for(const e of ss.entries){
      const mach=MACHINES[e.m]; if(!mach) continue;
      for(const mu of mach.primary) if(vol[mu]!=null) vol[mu]+=e.sets.length;
      for(const mu of mach.secondary) if(vol[mu]!=null) vol[mu]+=0.5*e.sets.length;
    }
  }
  return vol;
}

// ---------- local storage ----------
const store = {
  ok:true,
  load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ this.ok=false; return null; } },
  save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){ this.ok=false; } },
};
const DEFAULT_STATE = {sessions:[],tests:[],active:null,updatedAt:null,
  settings:{mesoStart:new Date().toISOString(), deload:false, intensity:INTENSITY_DEFAULT, eccPct:ECC_PCT_DEFAULT, schedule:3, blockAnchorCount:null}};
let state = Object.assign({}, DEFAULT_STATE, store.load()||{});
state.settings = Object.assign({}, DEFAULT_STATE.settings, state.settings||{});
// One-time: anchor the training block to the sessions already logged, so moving to
// session-based counting starts a fresh block here rather than jumping mid-phase.
if(state.settings.blockAnchorCount==null) state.settings.blockAnchorCount=(state.sessions||[]).length;
if([2,3,4].indexOf(state.settings.schedule)<0) state.settings.schedule=3;
// 0.92 was only ever an unannounced default, never something anyone chose. Clear it once
// and record the fact, so a deliberate 92% later is left alone.
if(!state.settings.intensitySet && Math.abs((state.settings.intensity||1)-0.92)<1e-6){
  state.settings.intensity = 1.00;
  state.settings.intensitySet = true;
  // Rewrite the same default on past sessions so the discount cancels exactly as it did
  // before. Clearing only the setting would hand you a 9% jump you never asked for.
  // Weights, reps and RIR are untouched; only the prescription context is normalised.
  state.sessions = (state.sessions||[]).map(ss =>
    (ss.intensity==null || Math.abs(ss.intensity-0.92)<1e-6) ? Object.assign({},ss,{intensity:1.00}) : ss);
  store.save(state);
}

const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- github sync ----------
// The repo config is public and harmless. The token is NOT stored here: it lives in
// this device's localStorage only. A token committed to a public repo gets found and
// revoked by GitHub's secret scanning, so hardcoding it would break within hours.
const b64enc = str => { const b=new TextEncoder().encode(str); let s=""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64dec = b64 => { const bin=atob(String(b64).replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); };

function localCfg(){
  try{ return JSON.parse(localStorage.getItem(TOKEN_KEY)||"{}"); }catch(e){ return {}; }
}
function saveCfg(patch){
  const c=Object.assign(localCfg(),patch);
  try{ localStorage.setItem(TOKEN_KEY, JSON.stringify(c)); }catch(e){}
  return c;
}
function mergeState(local, remote){
  const map=arr=>{ const m=new Map(); (arr||[]).forEach(x=>m.set(String(x.id),x)); return m; };
  const S=map(local.sessions); map(remote.sessions).forEach((v,k)=>{ if(!S.has(k)) S.set(k,v); });
  const T=map(local.tests);    map(remote.tests).forEach((v,k)=>{ if(!T.has(k)) T.set(k,v); });
  const sessions=[...S.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const tests=[...T.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const lt=x=>new Date((x&&x.updatedAt)||0).getTime();
  const settings=lt(remote)>lt(local)?remote.settings:local.settings;
  return Object.assign({},local,{sessions,tests,
    settings:Object.assign({},DEFAULT_STATE.settings,settings||{})});
}

const sync = {
  status:"off", msg:"Local only", sha:null, timer:null, busy:false,
  cfg(){
    const c=localCfg();
    return {owner:c.owner||SYNC.owner, repo:c.repo||SYNC.repo,
            branch:c.branch||SYNC.branch, path:c.path||SYNC.path, token:c.token||""};
  },
  ready(){ const c=this.cfg(); return !!(c.owner&&c.repo&&c.token); },
  url(){ const c=this.cfg(); return "https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+c.path; },
  head(){ return {Authorization:"Bearer "+this.cfg().token, Accept:"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"}; },
  set(st,msg){ this.status=st; this.msg=msg; paintSync(); },
  async pull(silent){
    if(!this.ready()){ this.set("off","Local only"); return false; }
    this.set("busy","Syncing");
    try{
      const r=await fetch(this.url()+"?ref="+encodeURIComponent(this.cfg().branch)+"&t="+Date.now(),{headers:this.head(),cache:"no-store"});
      if(r.status===404){ this.sha=null; this.set("ok","Synced"); return true; }
      if(r.status===401||r.status===403){ this.set("err","Token rejected"); return false; }
      if(!r.ok){ this.set("err","HTTP "+r.status); return false; }
      const j=await r.json();
      this.sha=j.sha;
      const remote=JSON.parse(b64dec(j.content));
      if(remote && Array.isArray(remote.sessions)){
        const before=state.sessions.length;
        state=mergeState(state,remote);
        store.save(state);
        const gained=state.sessions.length-before;
        this.set("ok", gained>0 ? "Pulled "+gained : "Synced");
        if(!silent) render();
        return true;
      }
      this.set("ok","Synced"); return true;
    }catch(e){ this.set("err","Offline"); return false; }
  },
  async push(retry){
    if(!this.ready()){ this.set("off","Local only"); return; }
    if(this.busy) return;
    this.busy=true; this.set("busy","Saving");
    try{
      const payload=Object.assign({},state,{active:null,updatedAt:new Date().toISOString()});
      const body={message:"training log "+new Date().toISOString().slice(0,16).replace("T"," "),
        content:b64enc(JSON.stringify(payload,null,1)), branch:this.cfg().branch};
      if(this.sha) body.sha=this.sha;
      const r=await fetch(this.url(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},this.head()),body:JSON.stringify(body)});
      if(r.status===409||r.status===422){
        // Someone else wrote first. Pull, merge, try once more.
        this.busy=false;
        if(!retry){ await this.pull(true); return this.push(true); }
        this.set("err","Conflict"); return;
      }
      if(r.status===401||r.status===403){ this.set("err","Token rejected"); return; }
      if(!r.ok){ this.set("err","HTTP "+r.status); return; }
      const j=await r.json();
      this.sha=(j.content&&j.content.sha)||this.sha;
      this.set("ok","Saved");
    }catch(e){ this.set("err","Offline"); }
    finally{ this.busy=false; }
  },
  schedule(){
    if(!this.ready()) return;
    clearTimeout(this.timer);
    this.set("busy","Pending");
    this.timer=setTimeout(()=>this.push(false), 2500);
  },
};
function paintSync(){
  const d=document.getElementById("syncDot"), t=document.getElementById("syncTxt");
  if(!d) return;
  d.className="sync-dot "+({ok:"ok",busy:"busy",err:"err"}[sync.status]||"");
  t.textContent=sync.msg;
}
function mutate(fn){
  state=fn(state);
  state.updatedAt=new Date().toISOString();
  store.save(state);
  sync.schedule();
  render();
}

// ---------- charts ----------
function smoothPath(P, tension){
  tension = tension==null ? 0.75 : tension;
  if(P.length<2) return "";
  let d="M"+P[0].x.toFixed(1)+","+P[0].y.toFixed(1);
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    const c1x=p1.x+(p2.x-p0.x)/6*tension, c1y=p1.y+(p2.y-p0.y)/6*tension;
    const c2x=p2.x-(p3.x-p1.x)/6*tension, c2y=p2.y-(p3.y-p1.y)/6*tension;
    d+="C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1);
  }
  return d;
}
// Gridlines must sit on round numbers, otherwise the printed label lies about
// where the line is (a line at 2.333 rendered as "+2").
// Use however many decimals the step actually needs, found by trial rather than guessed.
// Any heuristic gets this wrong somewhere: a step of 2.5 is not <1, and a step of 0.005
// needs three places, so both a "<1" rule and a fixed two-place rule mislabel gridlines.
function tickDec(step){
  if(!isFinite(step) || step<=0) return 0;
  for(let d=0; d<=6; d++) if(Math.abs(step-parseFloat(step.toFixed(d)))<1e-12) return d;
  return 6;
}
function niceTicks(min, max, target){
  const span=max-min;
  if(!(span>0)) return {ticks:[min], step:1};
  const raw=span/Math.max(1,target);
  const mag=Math.pow(10, Math.floor(Math.log10(raw)));
  const n=raw/mag;
  // Thresholds sit between the candidate steps, not on them. The old ladder sent
  // n=2.7 straight to 5, which drew a chart with two gridlines on it.
  const step=(n<=1.5?1:n<=2.2?2:n<=3.5?2.5:n<=7?5:10)*mag;
  const out=[];
  for(let t=Math.ceil(min/step-1e-9)*step; t<=max+step*1e-9; t+=step) out.push(Math.round(t/step)*step);
  return {ticks:out, step:step};
}
function trendLine(pts){
  const n=pts.length; if(n<2) return null;
  // Epoch ms squared overflows double precision, so regress on days since the first point.
  const t0=pts[0].t, sc=86400000;
  let st=0,sv=0,stv=0,stt=0;
  for(const p of pts){ const x=(p.t-t0)/sc; st+=x; sv+=p.v; stv+=x*p.v; stt+=x*x; }
  const den=n*stt-st*st; if(Math.abs(den)<1e-9) return null;
  const m=(n*stv-st*sv)/den, b=(sv-m*st)/n;
  return t=>m*((t-t0)/sc)+b;
}
function waveChart(pts, o){
  o=o||{};
  if(pts.length<2) return '<p class="hint">'+esc(o.empty||"Two sessions needed to draw the curve.")+'</p>';
  const W=Math.max(250,Math.min((window.innerWidth||400)-62,470)), H=200;
  const PL=38,PR=14,PT=16,PB=24;   // PR leaves room for the end marker
  const vs=pts.map(p=>p.v), ts=pts.map(p=>p.t);
  let minV=Math.min(...vs), maxV=Math.max(...vs);
  if(o.zero){ const m=Math.max(Math.abs(minV),Math.abs(maxV),4)*1.15; minV=-m; maxV=m; }
  else { const pad=(maxV-minV)*0.2||Math.max(3,maxV*0.06); minV-=pad; maxV+=pad; }
  const minT=Math.min(...ts), maxT=Math.max(...ts);
  const X=t=>PL+((t-minT)/((maxT-minT)||1))*(W-PL-PR);
  const Xi=i=>PL+(i/((pts.length-1)||1))*(W-PL-PR);
  const Y=v=>H-PB-((v-minV)/((maxV-minV)||1))*(H-PT-PB);
  const P=pts.map((p,i)=>({x:o.even?Xi(i):X(p.t),y:Y(p.v),src:p.src}));
  // optional smoothed companion series, same x positions
  const S=(o.series2&&o.series2.length===pts.length)
    ? o.series2.map((v,i)=>({x:P[i].x,y:Y(v)})) : null;
  const fmtD=t=>{const d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1);};
  const uid="g"+Math.random().toString(36).slice(2,7);
  const col=o.color||"#e8a33d";
  let g='<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.label||"Trend")+'">';
  g+='<defs><linearGradient id="'+uid+'" x1="0" x2="0" y1="0" y2="1">'+
     '<stop offset="0%" stop-color="'+col+'" stop-opacity=".24"/>'+
     '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  const nt=niceTicks(minV,maxV,4);
  const dec=tickDec(nt.step);
  for(const v of nt.ticks){
    const y=Y(v);
    if(y<PT-1||y>H-PB+1) continue;
    g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#453e36"/>';
    g+='<text x="'+(PL-6)+'" y="'+(y+3.5).toFixed(1)+'" fill="#8d8271" font-size="9" text-anchor="end" font-family="ui-monospace,monospace">'+
       ((o.zero&&v>0?"+":"")+v.toFixed(dec))+'</text>';
  }
  if(o.zero) g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="#a89c88" stroke-width="1.5" stroke-dasharray="2,3"/>';
  const d=smoothPath(P);
  g+='<path d="'+d+' L'+P[P.length-1].x.toFixed(1)+','+Y(o.zero?0:minV).toFixed(1)+' L'+P[0].x.toFixed(1)+','+Y(o.zero?0:minV).toFixed(1)+' Z" fill="url(#'+uid+')"/>';
  const tl=trendLine(pts);
  const trendSeg = (tl&&pts.length>=3)
    ? '<line x1="'+P[0].x.toFixed(1)+'" y1="'+Y(tl(minT)).toFixed(1)+'" x2="'+P[P.length-1].x.toFixed(1)+
      '" y2="'+Y(tl(maxT)).toFixed(1)+'" stroke="#8fb573" stroke-width="1.4" stroke-dasharray="5,4" opacity=".85"/>'
    : null;
  if(o.mean!=null){
    const my=Y(o.mean);
    if(my>=PT&&my<=H-PB){
      const lab='avg '+(o.mean>0?"+":"")+o.mean.toFixed(1);
      const lw=lab.length*5.5+8, lx=W-PR-lw, ly=Math.min(Math.max(my-14,PT),H-PB-13);
      g+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+my.toFixed(1)+'" y2="'+my.toFixed(1)+'" stroke="#7ba3c8" stroke-width="1.3" stroke-dasharray="1,3"/>';
      // Sits on its own chip so it stays readable where the trend line crosses it.
      g+='<rect x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" width="'+lw.toFixed(1)+'" height="13" rx="3" fill="#201d1a" stroke="#7ba3c8" stroke-opacity=".45"/>';
      g+='<text x="'+(W-PR-4).toFixed(1)+'" y="'+(ly+9.5).toFixed(1)+'" fill="#7ba3c8" font-size="9" text-anchor="end" font-family="ui-monospace,monospace">'+lab+'</text>';
    }
  }
  if(S) g+='<path d="'+smoothPath(S)+'" fill="none" stroke="#a89c88" stroke-width="1.6" stroke-dasharray="6,4" opacity=".9"/>';
  g+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  if(trendSeg) g+=trendSeg;   // drawn last: on linear data it sits exactly under the curve
  for(const p of P) g+= p.src==="test"
    ? '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4.5" fill="#201d1a" stroke="'+col+'" stroke-width="2"/>'
    : '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="'+col+'"/>';
  const dA=fmtD(minT), dB=fmtD(maxT);
  // Compare rendered dates, not raw timestamps: a run that straddles midnight is two
  // calendar days and should show both, even though it is only hours wide.
  if(dA===dB){
    // every point landed on one day: two identical end labels are noise
    g+='<text x="'+((PL+W-PR)/2).toFixed(1)+'" y="'+(H-6)+'" fill="#8d8271" font-size="9" text-anchor="middle" font-family="ui-monospace,monospace">'+
       dA+' · '+pts.length+' sessions</text>';
  } else {
    g+='<text x="'+P[0].x.toFixed(1)+'" y="'+(H-6)+'" fill="#8d8271" font-size="9" font-family="ui-monospace,monospace">'+dA+'</text>';
    g+='<text x="'+P[P.length-1].x.toFixed(1)+'" y="'+(H-6)+'" fill="#8d8271" font-size="9" text-anchor="end" font-family="ui-monospace,monospace">'+dB+'</text>';
  }
  return g+'</svg>';
}
function sparkSVG(pts){
  const W=64,H=20;
  if(pts.length<2) return '<svg width="'+W+'" height="'+H+'"></svg>';
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs);
  const P=pts.map((p,i)=>({x:(i/(pts.length-1))*(W-4)+2, y:H-3-((p.v-mn)/((mx-mn)||1))*(H-6)}));
  return '<svg width="'+W+'" height="'+H+'"><path d="'+smoothPath(P)+'" fill="none" stroke="'+(vs[vs.length-1]>=vs[0]?"#8fb573":"#c8564a")+'" stroke-width="1.6" stroke-linecap="round"/></svg>';
}

// ---------- rest clock ----------
// Lives outside #app and is driven imperatively, so a render never resets it.
const rest = {
  end:0, total:0, timer:null,
  el(){ return document.getElementById("restbar"); },
  build(label){
    const b=this.el(); if(!b) return;
    b.innerHTML='<span class="rest-time" id="restTime">--</span>'+
      '<span class="rest-mid"><span class="rest-lab" id="restLab">'+esc(label)+'</span>'+
      '<span class="rest-track"><span class="rest-fill" id="restFill" style="width:100%"></span></span></span>'+
      '<button class="btn btn-ghost btn-sm" id="restAdd" onclick="app.restAdd(30)">+30s</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="app.restSkip()">Skip</button>';
  },
  start(sec, label){
    if(state.settings.restTimer===false) return;
    this.total=sec; this.end=Date.now()+sec*1000;
    this.build(label);
    document.body.classList.add("resting");
    clearInterval(this.timer);
    this.timer=setInterval(()=>this.tick(),200);
    this.tick();
  },
  extend(sec){ if(!this.end) return; this.end+=sec*1000; this.total+=sec;
    if(!this.timer) this.timer=setInterval(()=>this.tick(),200); this.tick(); },
  stop(){
    clearInterval(this.timer); this.timer=null; this.end=0; this.total=0;
    const b=this.el(); if(b){ b.className="restbar"; b.innerHTML=""; }
    document.body.classList.remove("resting");
  },
  tick(){
    const b=this.el(); if(!b||!this.end) return;
    const leftMs=this.end-Date.now();
    const left=Math.max(0,Math.ceil(leftMs/1000));
    const over=leftMs<=0;
    b.className="restbar on"+(over?" done":"");
    const t=document.getElementById("restTime"), f=document.getElementById("restFill");
    if(t) t.textContent = over ? "GO" : Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
    if(f) f.style.width = (this.total? Math.max(0,Math.min(1,leftMs/(this.total*1000)))*100 : 0).toFixed(1)+"%";
    if(over && this.timer){
      clearInterval(this.timer); this.timer=null;
      const lab=document.getElementById("restLab"); if(lab) lab.textContent="Rested — go";
      const add=document.getElementById("restAdd"); if(add) add.remove();
      if(navigator.vibrate){ try{ navigator.vibrate([160,90,160]); }catch(e){} }
      setTimeout(()=>{ if(!this.timer && this.end && Date.now()>=this.end) this.stop(); }, 10000);
    }
  },
};

function draft(item, lastReps){
  if(!ui.drafts[item.m]) ui.drafts[item.m]={
    reps: item.adaptive?15:(lastReps||item.lo||10), rir:item.adaptive?0:2, w:null, we:null};
  return ui.drafts[item.m];
}
const fillClass = v => v>=0.65?"f-green":v>=0.4?"f-amber":"f-red";
const textClass = v => v>=0.65?"t-green":v>=0.4?"t-amber":"t-red";
function ctxOf(s, a){ return {rough:a?a.rough:ui.rough, deload:a?a.deload:!!s.settings.deload, week:mesoWeek(s)}; }

      '<span class="grp-caret">'+(open?"▾":"▸")+'</span></div>';

      h+='<div class="grp-detail">';

        h+='<div class="mini"><span class="mini-name">'+esc(MUSCLES[k].label)+'</span>'+
          '<span class="mini-track"><span class="grp-fill '+fillClass(mv)+'" style="width:'+Math.max(4,mv*100)+'%"></span></span>'+

      (meth!=="Regular"?'<span class="chip chip-'+meth+'">'+meth.toUpperCase()+'</span>':'')+'</div>';
  });
  h+='<p class="hint">'+esc(day.cardio)+'</p></div>';
  return h;
}

// ---------- session ----------
function sessionView(){
  const a=state.active;
  if(!a) return '<div class="card"><div class="eyebrow">Nothing running</div>'+
    '<p style="color:var(--dim);font-size:14px">Start a session from the Today tab. Every set saves the moment you log it.</p>'+
    '<div class="actions"><button class="btn btn-amber btn-wide" onclick="app.tab(\'today\')">Go to Today</button></div></div>';
  const day=PROGRAM[a.day], ctx=ctxOf(state,a);
  const logged=a.entries.reduce((x,e)=>x+e.sets.length,0);
  const totalTarget=day.items.reduce((x,it)=>{
    let t=it.sets; if(a.rough&&t>=3)t--; if(a.deload)t=Math.max(1,Math.ceil(it.sets/2)); return x+t; },0);

  // Focus falls to the first exercise that still has sets owing.
  const targetOf=it=>{ let t=it.sets; if(a.rough&&t>=3)t--; if(a.deload)t=Math.max(1,Math.ceil(it.sets/2)); return t; };
  const doneOf=it=>{ const e=a.entries.find(x=>x.m===it.m); return e?e.sets.length:0; };
  if(!ui.focus || !day.items.some(it=>it.m===ui.focus)){
    const nx=day.items.find(it=>doneOf(it)<targetOf(it));
    ui.focus = nx?nx.m:day.items[0].m;
  }

  let h='<div class="card"><div class="row between">'+
    '<div><div class="eyebrow" style="margin:0">'+esc(day.title)+(a.rough?' · rough':'')+(a.deload?' · deload':'')+
      (Math.abs((a.intensity==null?1:a.intensity)-1)>0.005?' · intensity '+Math.round(a.intensity*100)+'%':'')+'</div>'+
    '<div style="font-weight:700;font-size:17px;margin-top:4px">'+esc(day.sub)+'</div></div>'+
    '<div style="text-align:right"><div class="mono" style="color:var(--amber);font-size:22px;font-weight:700">'+logged+'</div>'+
    '<div class="rx-ecc-lab">of '+totalTarget+'</div></div></div></div>';

  day.items.forEach((item,i)=>{
    const mach=MACHINES[item.m];
    const method=resolveMethod(item,ctx);
    const target=targetOf(item);
    const p=prescribe(state,item,a.day,{rough:a.rough,deload:a.deload});
    const entry=a.entries.find(e=>e.m===item.m);
    const sets=entry?entry.sets:[];
    const done=sets.length>=target;
    const open=ui.focus===item.m;
    const d=draft(item,p.lastReps);
    const prefill = d.w!=null ? d.w : (sets.length?sets[sets.length-1].w:p.w);
    const realD = p.lastW ? ((p.w-p.lastW)/p.lastW)*100 : null;
    const eccMod=(state.settings.intensity||INTENSITY_DEFAULT)*(a.rough?0.95:1)*(a.deload?0.85:1);
    const ecc=eccWeight(state,item,a.day,p.w,eccMod);
    const eccW=ecc.w;

    h+='<div class="ex'+(done?' done':'')+'">'+
      '<div class="ex-head" onclick="app.focus(\''+item.m+'\')" role="button" tabindex="0">'+
      '<span class="ex-idx">'+(i+1)+'</span>'+
      '<span class="ex-info"><span class="ex-name">'+esc(mach.name)+'</span>'+
      '<span class="ex-sub">'+(item.adaptive?target+' sets to failure':target+' x '+item.lo+'-'+item.hi)+' · '+p.w+' lb</span></span>'+
      (done?'<span class="ex-state t-green">DONE</span>':'<span class="ex-state t-dim">'+sets.length+'/'+target+'</span>')+
      '</div>';

    if(open){
      h+='<div class="ex-body">';
      h+='<div class="row between" style="margin-bottom:12px"><span class="chip chip-'+method+'">'+method.toUpperCase()+'</span>'+
        '<span class="rx-ecc-lab">rest '+(item.rest>=60?Math.floor(item.rest/60)+"m"+(item.rest%60?" "+(item.rest%60)+"s":""):item.rest+"s")+
        (item.finisher&&!a.deload?' · last set adaptive':'')+'</span></div>';
      h+='<div class="rx"><div class="rx-top"><span class="rx-w">'+p.w+'</span><span class="rx-u">lb</span>'+
        '<span class="rx-reps">'+(item.adaptive?target+' x failure':target+' x '+item.lo+'-'+item.hi)+'</span></div>';
      if(method==="Negative"){
        h+='<div class="rx-ecc"><div class="rx-ecc-col"><div class="rx-ecc-lab">Positive · lifting</div>'+
          '<div class="rx-ecc-val t-amber">'+p.w+' lb</div></div>'+
          '<span class="rx-arrow">→</span>'+
          '<div class="rx-ecc-col"><div class="rx-ecc-lab">Negative · lowering</div>'+
          '<div class="rx-ecc-val t-amber">'+eccW+' lb</div></div></div>'+
          '<div class="rx-why">Enter <b>both</b> numbers on the machine: <b>'+p.w+'</b> positive, <b>'+eccW+'</b> negative. It swaps between them at the turnaround. Take three seconds to lower.<br>'+
          (ecc.followed
            ? 'Matching the split you used last time ('+Math.round((eccW/p.w-1)*100)+'% heavier).'
            : Math.round(ecc.pct*100)+'% of your estimated 1RM, '+Math.round((eccW/p.w-1)*100)+'% above the lifting weight.')+'</div>';
      } else {
        h+='<div class="rx-why">'+esc(METHODS[method].set)+'</div>';
      }
      const dTxt = realD==null ? '' :
        Math.abs(realD)<0.05 ? '<b class="t-dim">same weight</b> · ' :
        '<b class="'+(realD>0?'t-green':'t-red')+'">'+(realD>0?'+':'')+realD.toFixed(1)+'%</b> · ';
      h+='<div class="rx-why">'+(p.seeded?'':dTxt)+esc(p.why)+
        (p.note?'<br>'+esc(p.note):'')+
        (p.last?'<br>Last time: '+esc(p.last):'')+'</div>';
      if(item.note) h+='<div class="rx-why" style="color:var(--dim)">'+esc(item.note)+'</div>';
      h+='</div>';

      if(sets.length) h+='<div class="setrow">'+sets.map((s,j)=>'<span class="setpill'+(j===sets.length-1?' last':'')+'">'+s.w+(s.we?'/'+s.we:'')+' x '+s.reps+(item.adaptive?'':' @'+s.rir)+'</span>').join('')+'</div>';

      if(!done){
        const prefillE = d.we!=null ? d.we : (sets.length&&sets[sets.length-1].we ? sets[sets.length-1].we : eccW);
        h+='<div class="logrow">'+
          '<div class="field"><div class="field-lab">'+(method==="Negative"?"Positive lb":"Weight lb")+'</div>'+
          '<input class="win" id="w-'+item.m+'" inputmode="decimal" value="'+prefill+'" oninput="app.setW(\''+item.m+'\',this.value)" aria-label="Weight in pounds"></div>'+
          (method==="Negative"?'<div class="field"><div class="field-lab">Negative lb</div>'+
            '<input class="win" id="we-'+item.m+'" inputmode="decimal" value="'+prefillE+'" oninput="app.setWe(\''+item.m+'\',this.value)" aria-label="Negative weight in pounds"></div>':'')+
          '<div class="field"><div class="field-lab">Reps</div>'+
          '<div class="step"><button onclick="app.reps(\''+item.m+'\',-1)" aria-label="Fewer reps">−</button>'+
          '<span>'+d.reps+'</span><button onclick="app.reps(\''+item.m+'\',1)" aria-label="More reps">+</button></div></div></div>';
        if(!item.adaptive){
          h+='<div class="field-lab">Reps left in the tank</div>'+
            '<div class="rirrow">'+[0,1,2,3,4].map(r=>'<button class="'+(d.rir===r?'on':'')+'" onclick="app.rir(\''+item.m+'\','+r+')">'+r+'</button>').join('')+'</div>';
        }
        if(ui.logErr && ui.logErr.m===item.m)
          h+='<div class="warn" style="margin-bottom:10px">'+esc(ui.logErr.msg)+'</div>';
        h+='<div class="actions"><button class="btn btn-amber btn-wide" onclick="app.log(\''+item.m+'\',\''+method+'\','+(item.adaptive?1:0)+')">Log set '+(sets.length+1)+' of '+target+'</button></div>';
      } else {
        h+='<div class="actions"><button class="btn btn-ghost btn-sm" onclick="app.log(\''+item.m+'\',\''+method+'\','+(item.adaptive?1:0)+')">Add another set</button></div>';
      }
      h+='</div>';
    }
    h+='</div>';
  });

  h+='<div class="card cardio">'+esc(day.cardio)+'</div>';
  h+='<div class="row" style="gap:9px"><button class="btn btn-amber grow" '+(logged?'':'disabled')+' onclick="app.finish()">Finish session</button>'+
    '<button class="btn btn-ghost" onclick="app.discard()">Discard</button></div>';
  return h;
}

// ---------- progress ----------
function progressView(){
  let h='<div class="chips" style="margin-bottom:2px">'+
    '<button class="chipbtn '+(ui.progMode==="perf"?"on":"")+'" onclick="app.progMode(\'perf\')">Performance</button>'+
    '<button class="chipbtn '+(ui.progMode==="e1rm"?"on":"")+'" onclick="app.progMode(\'e1rm\')">Strength</button>'+
    '<button class="chipbtn '+(ui.progMode==="vol"?"on":"")+'" onclick="app.progMode(\'vol\')">Volume</button></div>';

  if(ui.progMode==="perf"){
    const pts=state.sessions.map(ss=>({t:new Date(ss.date).getTime(),v:sessionScore(ss),day:ss.day})).filter(p=>p.v!=null);
    const avg=pts.length?pts.reduce((a,p)=>a+p.v,0)/pts.length:0;
    h+='<div class="card"><div class="eyebrow">How each session went vs its prescription</div>'+
      '<div class="bigval '+(avg>=0?"t-green":"t-red")+'">'+(avg>=0?"+":"")+avg.toFixed(1)+'<span class="unit"> % average</span></div>'+
      waveChart(pts,{zero:true,even:true,mean:avg,label:"Session performance",empty:"Log two sessions to draw the curve."})+
      '<div class="legend"><span><span class="t-amber">──</span> per session</span>'+
      '<span style="color:#7ba3c8">···· average</span><span><span class="t-green">- -</span> trend</span></div>'+
      '<p class="hint">Above the centre line you beat the prescription and the console adds load. Below it you fell short and it backs off. A good block waves gently upward.</p></div>';
    if(pts.length){
      h+='<div class="card"><div class="eyebrow">Recent sessions</div>';
      for(const p of pts.slice(-8).reverse()){
        const d=new Date(p.t);
        h+='<div class="sprow" style="cursor:default"><span class="sp-name on">'+esc(PROGRAM[p.day]?PROGRAM[p.day].title:p.day)+'</span>'+
          '<span class="sp-val" style="flex:1;text-align:left">'+d.getDate()+'/'+(d.getMonth()+1)+'</span>'+
          '<span class="sp-val '+(p.v>=0?"t-green":"t-red")+'">'+(p.v>=0?"+":"")+p.v.toFixed(1)+'%</span></div>';
      }
      h+='</div>';
    }
    return h;
  }

  if(ui.progMode==="vol"){
    const vol=weeklyVolume(state);
    h+='<div class="card"><div class="eyebrow">Sets per muscle, last 7 days</div>';
    for(const [k,t] of Object.entries(TARGETS)){
      const v=vol[k]||0, p=Math.min(1,v/t);
      h+='<div class="volrow"><span class="vol-label">'+esc(MUSCLES[k].label)+'</span>'+
        '<span class="vol-track"><span class="vol-fill '+(p>=1?"f-green":p>=0.5?"f-amber":"f-dim")+'" style="width:'+Math.max(4,p*100)+'%"></span></span>'+
        '<span class="vol-num">'+(Math.round(v*10)/10)+'/'+t+'</span></div>';
    }
    h+='<p class="hint">Indirect work counts as half a set \u2014 the counting method the volume research supports best. The targets are one full 4\u00d7 week, so a 4\u00d7 week fills every bar. On 3\u00d7 and 2\u00d7 weeks the upper and ab bars still fill; legs (and on 3\u00d7 the oblique and lower-back bars) sit lower on purpose \u2014 that is the volume you trade away by training less.</p></div>';
    return h;
  }

  const mId=ui.progM, pts=machinePoints(state,mId), roll=rollingE1RM(state,mId);
  // Only call it a four week change when four weeks of data exist. Otherwise say what
  // it really is: the change across however many sessions have been logged.
  let delta=null, deltaLab="";
  if(pts.length>=2){
    const spanDays=(pts[pts.length-1].t-pts[0].t)/(24*HOUR);
    const cut=Date.now()-28*24*HOUR, old=pts.filter(p=>p.t<=cut);
    if(spanDays>=21 && old.length){
      delta=((pts[pts.length-1].v-old[old.length-1].v)/old[old.length-1].v)*100; deltaLab="/ 4wk";
    } else {
      delta=((pts[pts.length-1].v-pts[0].v)/pts[0].v)*100;
      deltaLab="over "+pts.length+" sessions";
    }
  }
  const rollSeries=pts.map((_,i)=>rollFromPoints(pts.slice(0,i+1)));
  const latest=pts.length?pts[pts.length-1].v:null;
  h+='<div class="chips">'+Object.entries(MACHINES).map(([k,m])=>
    '<button class="chipbtn '+(k===mId?'on':'')+'" onclick="app.prog(\''+k+'\')">'+esc(m.name)+'</button>').join('')+'</div>';
  h+='<div class="card"><div class="eyebrow">'+esc(MACHINES[mId].name)+' · estimated 1RM</div>'+
    '<div class="row" style="align-items:baseline;gap:10px"><span class="bigval">'+Math.round(roll.v)+'<span class="unit"> lb '+(roll.seeded?'seed':'rolling')+'</span></span>'+
    (delta!=null?'<span class="delta '+(delta>=0?'t-green':'t-red')+'">'+(delta>=0?'+':'')+delta.toFixed(1)+'% '+esc(deltaLab)+'</span>':'')+'</div>'+
    (latest!=null&&Math.abs(latest-roll.v)>=1?'<div class="hint" style="margin:2px 0 0">Best single session so far: '+Math.round(latest)+
      ' lb. The headline is smoothed across your last six, so it trails a fast climb on purpose.</div>':'')+
    waveChart(pts,{even:true,series2:rollSeries,label:"Estimated 1RM"})+
    '<div class="legend"><span><span class="t-amber">──</span> per session</span>'+
    '<span><span style="color:var(--dim)">- -</span> smoothed</span>'+
    '<span><span class="t-green">- -</span> trend</span></div></div>';
  h+='<div class="card"><div class="eyebrow">All machines</div>';
  for(const [k,m] of Object.entries(MACHINES)){
    const r=rollingE1RM(state,k);
    h+='<div class="sprow" onclick="app.prog(\''+k+'\')"><span class="sp-name '+(k===mId?'on':'')+'">'+esc(m.name)+'</span>'+
      sparkSVG(machinePoints(state,k).slice(-8))+'<span class="sp-val">'+Math.round(r.v)+' lb'+(r.seeded?'*':'')+'</span></div>';
  }
  h+='<p class="hint">* seed value, nothing logged yet</p></div>';
  return h;
}
